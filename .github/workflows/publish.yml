name: Publish

on:
  push:
    branches: [ main ]
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to JSR (dry run)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        run: npx jsr publish --dry-run

      - name: Publish to JSR
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx jsr publish

